<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150" font-family="'Segoe Print','Ink Free','Comic Sans MS',Gisha,sans-serif">
<defs>
  <!-- pencil wobble: displaces every stroke so nothing looks machine-drawn -->
  <filter id="rough" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.1" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="29" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- paper grain -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="5" result="t"/>
    <feColorMatrix in="t" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    <feComposite operator="over" in2="SourceGraphic"/>
  </filter>
  <style>
    .ink   { fill:none; stroke:#2b2b30; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .ink-t { fill:none; stroke:#2b2b30; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .lbl   { font-size:15px; fill:#2b2b30; }
    .lbl-s { font-size:12.5px; fill:#4a4a52; }
    .ui    { font-size:15px; fill:#22222a; }
    .he    { font-family:Gisha,Arial,sans-serif; direction:rtl; }
    .call  { font-family:Gisha,Arial,sans-serif; font-size:14.5px; fill:#7a2718; direction:rtl; }
    .num   { font-family:Gisha,Arial,sans-serif; font-size:15px; font-weight:bold; fill:#fff; }
    .wash-r{ fill:#c8564a; opacity:.55; } .wash-g{ fill:#6fae62; opacity:.55; }
    .wash-b{ fill:#5b8fc9; opacity:.5; }  .wash-y{ fill:#e0b23c; opacity:.6; }
    .wash-k{ fill:#3a3a42; opacity:.16; }
  </style>
</defs>

